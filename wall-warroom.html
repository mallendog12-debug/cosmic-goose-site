<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allen Home — Night Panel</title>
<style>
  html { font-size: 1.02vw; }
  html, body { margin:0; padding:0; height:100%; background:#0b1220; }
  .hp { --bg:#0b1220; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07); --line:rgba(255,255,255,.09); --ink:#f2f6fc; --mut:#93a4bd; --grn:#34d399; --gold:#fbbf24; --sky:#7dd3fc; --red:#f87171;
    min-height:100vh; height:100vh;
    background:radial-gradient(900px 480px at 85% -10%, rgba(56,132,255,.14), transparent 60%), radial-gradient(700px 400px at 0% 110%, rgba(52,211,153,.08), transparent 55%), var(--bg);
    color:var(--ink); font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; box-sizing:border-box; }
  .hp * { box-sizing:border-box; }
  .hp .stage { height:100%; display:flex; flex-direction:column; padding:1.6% 2%; gap:2.4%; }
  .hp .top { display:flex; align-items:center; gap:.7rem; }
  .hp .top .t { font-size:1.5rem; font-weight:700; letter-spacing:-.3px; line-height:1.05; }
  .hp .top .s { color:var(--mut); font-size:.78rem; margin-top:.15rem; }
  .hp .clock { text-align:right; }
  .hp .clock .tm { font-size:1.5rem; font-weight:700; letter-spacing:-.3px; line-height:1.05; }
  .hp .clock .dt { color:var(--mut); font-size:.78rem; margin-top:.15rem; }
  .hp .top .sp { flex:1; }
  .hp .pill { display:flex; align-items:center; gap:.45rem; font-size:.75rem; font-weight:600; padding:.45rem .8rem; border-radius:999px; background:var(--card2); border:1px solid var(--line); white-space:nowrap; }
  .hp .dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--grn); box-shadow:0 0 8px rgba(52,211,153,.9); flex:none; animation:pl 1.7s infinite; }
  .hp .dot.off { background:#5b6b84; box-shadow:none; animation:none; }
  .hp .dot.warn { background:var(--red); box-shadow:0 0 8px rgba(248,113,113,.9); }
  @keyframes pl { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  .hp .sec { font-size:.68rem; font-weight:700; letter-spacing:2.2px; color:var(--mut); margin-bottom:.5rem; }
  .hp .phones { display:flex; gap:2%; }
  .hp .pcard { flex:1; display:flex; align-items:center; gap:1rem; background:var(--card); border:1px solid var(--line); border-radius:1rem; padding:.9rem 1.1rem; }
  .hp .ava { position:relative; width:3.4rem; height:3.4rem; flex:none; }
  .hp .ava .ring { position:absolute; inset:0; border-radius:50%; border:2px solid; animation:pl 1.7s infinite; }
  .hp .ava .ring.still { animation:none; opacity:.35; }
  .hp .ava .in { position:absolute; inset:.32rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.2rem; font-weight:700; color:#0b1220; }
  .hp .pcard .nm { font-size:.8rem; color:var(--mut); font-weight:600; letter-spacing:.4px; }
  .hp .pcard .rm { font-size:1.5rem; font-weight:700; letter-spacing:-.3px; line-height:1.15; }
  .hp .pcard .mt { font-size:.75rem; color:var(--mut); margin-top:.15rem; display:flex; align-items:center; gap:.4rem; }
  .hp .tiles { display:flex; gap:2%; }
  .hp .tile { flex:1; background:var(--card); border:1px solid var(--line); border-radius:1rem; padding:.85rem 1rem; min-width:0; }
  .hp .tile .ic { width:2.3rem; height:2.3rem; border-radius:.65rem; background:rgba(52,211,153,.14); color:var(--grn); display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:800; letter-spacing:.5px; margin-bottom:.55rem; }
  .hp .tile .nm { font-size:1rem; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hp .tile .mt { font-size:.75rem; color:var(--mut); margin-top:.15rem; display:flex; align-items:center; gap:.4rem; white-space:nowrap; overflow:hidden; }
  .hp .strip { display:flex; gap:2%; }
  .hp .stat { flex:1; display:flex; align-items:center; gap:.65rem; background:var(--card); border:1px solid var(--line); border-radius:.9rem; padding:.7rem .95rem; min-width:0; }
  .hp .stat .a { font-size:.88rem; font-weight:650; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hp .stat .b { font-size:.72rem; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hp .foot { display:flex; justify-content:space-between; font-size:.65rem; color:#5f718c; letter-spacing:.3px; margin-top:auto; }
</style>
</head>
<body>
<div class="hp">
  <div class="stage">
    <div class="top">
      <div>
        <div class="t">Allen Home</div>
        <div class="s" id="daypart">Night panel</div>
      </div>
      <div class="sp"></div>
      <div class="pill" id="pill-doors"><span class="dot off"></span><span>Doors…</span></div>
      <div class="pill" id="pill-net"><span class="dot off"></span><span>Network…</span></div>
      <div class="clock">
        <div class="tm" id="clock">--:--</div>
        <div class="dt" id="date">&nbsp;</div>
      </div>
    </div>

    <div>
      <div class="sec">PHONES</div>
      <div class="phones">
        <div class="pcard">
          <div class="ava"><span class="ring" id="ring-mike" style="border-color:var(--gold)"></span><span class="in" style="background:var(--gold)">M</span></div>
          <div>
            <div class="nm">MIKE</div>
            <div class="rm" id="room-mike">…</div>
            <div class="mt"><span class="dot off" id="dot-mike"></span><span id="sub-mike">locating…</span></div>
          </div>
        </div>
        <div class="pcard">
          <div class="ava"><span class="ring" id="ring-heather" style="border-color:var(--sky)"></span><span class="in" style="background:var(--sky)">H</span></div>
          <div>
            <div class="nm">HEATHER</div>
            <div class="rm" id="room-heather">…</div>
            <div class="mt"><span class="dot off" id="dot-heather"></span><span id="sub-heather">locating…</span></div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="sec">ON NOW</div>
      <div class="tiles" id="tiles">
        <div class="tile"><div class="nm">Loading…</div><div class="mt">reading the house feed</div></div>
      </div>
    </div>

    <div class="strip">
      <div class="stat"><span class="dot off" id="dot-laundry"></span><div><div class="a" id="stat-laundry-a">Laundry</div><div class="b" id="stat-laundry-b">&nbsp;</div></div></div>
      <div class="stat"><span class="dot off" id="dot-audio"></span><div><div class="a" id="stat-audio-a">Audio</div><div class="b" id="stat-audio-b">&nbsp;</div></div></div>
      <div class="stat"><span class="dot off" id="dot-cams"></span><div><div class="a" id="stat-cams-a">Cameras</div><div class="b" id="stat-cams-b">&nbsp;</div></div></div>
      <div class="stat"><span class="dot off" id="dot-mesh"></span><div><div class="a" id="stat-mesh-a">Mesh</div><div class="b" id="stat-mesh-b">&nbsp;</div></div></div>
    </div>

    <div class="foot"><span>Live from Home Assistant + Deco mesh · refreshes every minute</span><span id="updated">Phone rooms = nearest mesh node</span></div>
  </div>
</div>
<script>
var MIKE_MAC = "D2-CB-1E-6F-20-87", HEATHER_MAC = "5A-83-B6-45-C4-F0";
function $(id){ return document.getElementById(id); }
function fmtRate(v){
  if (v >= 1000) return (v/1000).toFixed(1) + " MB/s";
  if (v >= 1) return Math.round(v) + " KB/s";
  return "active";
}
function fmtTime(iso){
  if (!iso) return "";
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  var ap = h >= 12 ? "PM" : "AM"; h = h % 12; if (h === 0) h = 12;
  return h + ":" + (m < 10 ? "0" + m : m) + " " + ap;
}
function zoneOf(dev){ return dev.ap ? dev.ap.replace(" Deco","") : ""; }
function floorOf(dev){ return (dev.ap && dev.ap.indexOf("Office") === 0) ? "Downstairs" : "Upstairs"; }
function setPhone(dev, roomId, subId, dotId, ringId, color){
  var room = $(roomId), sub = $(subId), dot = $(dotId), ring = $(ringId);
  if (dev && dev.online) {
    room.textContent = zoneOf(dev) || "Home";
    sub.textContent = floorOf(dev) + " · home";
    dot.className = "dot"; dot.style.background = color; dot.style.boxShadow = "0 0 8px " + color;
    ring.classList.remove("still");
  } else {
    room.textContent = "Away";
    sub.textContent = "Not home";
    dot.className = "dot off"; dot.style.background = ""; dot.style.boxShadow = "";
    ring.classList.add("still");
  }
}
function iconFor(dev){
  var k = dev.kind || "";
  if (k === "stick" || k === "tv") return "TV";
  if (k === "console") return "XB";
  if (k === "computer") return (dev.name.indexOf("MacBook") >= 0) ? "MB" : "PC";
  if (k === "phone") return "PH";
  if (k === "speaker") return "SP";
  if (k === "display") return "DP";
  if (k === "camera") return "CM";
  var w = (dev.name || "?").split(" ");
  return (w[0].charAt(0) + (w[1] ? w[1].charAt(0) : "")).toUpperCase();
}
function render(d){
  var devs = d.devices || [];
  var byMac = {};
  for (var i = 0; i < devs.length; i++) byMac[devs[i].mac] = devs[i];
  setPhone(byMac[MIKE_MAC], "room-mike", "sub-mike", "dot-mike", "ring-mike", "#fbbf24");
  setPhone(byMac[HEATHER_MAC], "room-heather", "sub-heather", "dot-heather", "ring-heather", "#7dd3fc");

  var doors = d.doors || {};
  var open = Object.keys(doors).filter(function(k){ return doors[k] === "open"; });
  var pd = $("pill-doors");
  if (open.length === 0) {
    pd.innerHTML = '<span class="dot"></span><span>All doors closed</span>';
  } else {
    pd.innerHTML = '<span class="dot warn"></span><span>' + open.join(", ") + ' open</span>';
  }
  var net = d.network || {};
  $("pill-net").innerHTML = '<span class="dot' + (net.internet_online ? '' : ' warn') + '"></span><span>' +
    (net.clients_online != null ? net.clients_online : "?") + ' devices online</span>';

  var active = devs.filter(function(x){
    return x.online && x.in_use && x.mac !== MIKE_MAC && x.mac !== HEATHER_MAC;
  }).sort(function(a,b){ return (b.down_kbps||0) - (a.down_kbps||0); }).slice(0,3);
  var tiles = $("tiles");
  if (active.length === 0) {
    tiles.innerHTML = '<div class="tile"><div class="ic">—</div><div class="nm">All quiet</div><div class="mt">Nothing streaming or active right now</div></div>';
  } else {
    tiles.innerHTML = active.map(function(x){
      var act = (x.kind === "stick" || x.kind === "tv" || x.kind === "console") ? "streaming · " : "";
      return '<div class="tile"><div class="ic">' + iconFor(x) + '</div><div class="nm">' + x.name + '</div>' +
        '<div class="mt"><span class="dot"></span> ' + zoneOf(x) + ' · ' + act + fmtRate(x.down_kbps || 0) + ' down</div></div>';
    }).join("");
  }

  var L = d.laundry || {}, w = L.washer || {}, dr = L.dryer || {};
  var la = $("stat-laundry-a"), lb = $("stat-laundry-b"), ld = $("dot-laundry");
  if (w.running) { la.textContent = "Washer running"; lb.textContent = "Cycle in progress"; ld.className = "dot"; }
  else if (dr.running) { la.textContent = "Dryer running"; lb.textContent = "Cycle in progress"; ld.className = "dot"; }
  else {
    la.textContent = "Laundry idle";
    var last = null, who = "";
    if (w.finished_at && (!dr.finished_at || w.finished_at > dr.finished_at)) { last = w.finished_at; who = "Washer"; }
    else if (dr.finished_at) { last = dr.finished_at; who = "Dryer"; }
    lb.textContent = last ? (who + " finished " + fmtTime(last)) : "No recent cycles";
    ld.className = "dot off";
  }

  var mp = d.media_playing || [];
  if (mp.length) {
    $("stat-audio-a").textContent = "Playing now";
    $("stat-audio-b").textContent = mp.join(", ");
    $("dot-audio").className = "dot";
  } else {
    $("stat-audio-a").textContent = "Nothing playing";
    $("stat-audio-b").textContent = "All speakers quiet";
    $("dot-audio").className = "dot off";
  }

  var cams = devs.filter(function(x){ return x.kind === "camera" && x.online; }).length;
  $("stat-cams-a").textContent = cams + " cameras online";
  $("stat-cams-b").textContent = "LaView + Tapo doorbell";
  $("dot-cams").className = cams ? "dot" : "dot off";

  var decos = (d.decos || []).filter(function(x){ return x.online; }).length;
  $("stat-mesh-a").textContent = "Mesh healthy";
  $("stat-mesh-b").textContent = decos + " Decos up · internet " + (net.internet_online ? "on" : "OFF");
  $("dot-mesh").className = net.internet_online ? "dot" : "dot warn";

  if (d.generated_at) $("updated").textContent = "Updated " + fmtTime(d.generated_at) + " · phone rooms = nearest mesh node";
}
function tickClock(){
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  var ap = h >= 12 ? "PM" : "AM"; h = h % 12; if (h === 0) h = 12;
  $("clock").textContent = h + ":" + (m < 10 ? "0" + m : m) + " " + ap;
  $("date").textContent = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  var hr = now.getHours();
  $("daypart").textContent = hr < 5 ? "Night panel" : hr < 12 ? "Morning panel" : hr < 18 ? "Day panel" : "Evening panel";
}
function load(){
  fetch("/house-status.json", { cache: "no-store" })
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(){ /* keep last good render */ });
}
tickClock(); setInterval(tickClock, 15000);
load(); setInterval(load, 60000);
</script>
</body>
</html>
