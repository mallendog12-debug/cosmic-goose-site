<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="1800">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAR ROOM — Allen Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#010204; height:100%; overflow:hidden; font-family:'Rajdhani', Arial, sans-serif; color:#cfe3ee; }
  body { display:flex; flex-direction:column; padding:26px 34px 18px; }

  /* ===== header ===== */
  header { display:flex; align-items:flex-start; justify-content:space-between; }
  .brand h1 { font-family:'Orbitron'; font-weight:700; font-size:21px; letter-spacing:5px; color:#9fd8f5; }
  .brand h1 .red { color:#ff3b30; }
  .brand .sub { font-family:'Share Tech Mono', monospace; font-size:12.5px; letter-spacing:2px; color:#5f8296; margin-top:5px; }
  .hdr-right { text-align:right; }
  #clock { font-family:'Orbitron'; font-weight:700; font-size:44px; color:#eaf6fc; letter-spacing:2px; line-height:1; }
  #dateline { font-family:'Share Tech Mono', monospace; font-size:13.5px; color:#5f8296; letter-spacing:2px; margin-top:6px; }
  #modebadge { display:inline-block; margin-top:8px; padding:3px 12px; border-radius:4px; font-family:'Orbitron'; font-weight:700;
               font-size:12.5px; letter-spacing:3px; border:1px solid #2b5871; color:#7fd4ff; }
  body.night #modebadge { border-color:#8a4a44; color:#c98a84; }

  /* ===== hero status ===== */
  #hero { margin-top:34px; text-align:center; }
  #herobig { font-family:'Orbitron'; font-weight:900; font-size:76px; letter-spacing:6px; color:#39d98a;
             text-shadow:0 0 26px rgba(57,217,138,.28); line-height:1.05; }
  #herobig.warn { color:#ffb02e; text-shadow:0 0 26px rgba(255,176,46,.30); }
  #herobig.alert { color:#ff6f66; text-shadow:0 0 26px rgba(255,59,48,.40); }
  #herosub { font-family:'Share Tech Mono', monospace; font-size:17px; letter-spacing:2px; color:#7fa6ba; margin-top:14px; }

  /* ===== panels ===== */
  main { flex:1; display:flex; flex-direction:column; gap:20px; margin-top:36px; min-height:0; max-width:1180px; width:100%; margin-left:auto; margin-right:auto; }
  .panel { background:linear-gradient(160deg, #06121a 0%, #030a10 100%); border:1px solid #12303f; border-radius:10px; padding:18px 24px; }
  .panel h2 { font-family:'Orbitron'; font-weight:700; font-size:16px; letter-spacing:3px; color:#9fd8f5; margin-bottom:14px; }

  /* needs attention */
  #attnlist { display:flex; flex-direction:column; gap:9px; }
  .attn { font-family:'Rajdhani'; font-weight:700; font-size:23px; letter-spacing:.5px; color:#ff6f66; }
  .attn.soft { color:#ffb02e; }
  #attnclear { font-family:'Rajdhani'; font-weight:600; font-size:23px; color:#5f8296; letter-spacing:.5px; }

  /* basics rows */
  .brow { display:flex; justify-content:space-between; align-items:baseline; padding:9px 2px; border-bottom:1px solid #0c2231; }
  .brow:last-child { border-bottom:none; }
  .brow .bk { font-family:'Share Tech Mono', monospace; font-size:15px; letter-spacing:2.5px; color:#5f8296; }
  .brow .bv { font-family:'Rajdhani'; font-weight:700; font-size:27px; color:#eaf6fc; letter-spacing:.5px; text-align:right; }
  .bv .ok { color:#39d98a; } .bv .warn { color:#ffb02e; } .bv .bad { color:#ff6f66; } .bv .dim { color:#8fa9ba; }

  /* devices strip */
  #devstrip { margin-top:6px; }
  #devline1, #devline2 { font-family:'Share Tech Mono', monospace; font-size:16.5px; letter-spacing:1px; color:#7fa6ba; line-height:1.65; }
  #devline1 b { color:#eaf6fc; font-weight:400; }
  #devline2 { color:#c98a84; }

  /* ===== footer ===== */
  footer { margin-top:20px; text-align:center; font-family:'Share Tech Mono', monospace; font-size:13px; letter-spacing:1.5px; color:#46606f; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>WAR <span class="red">ROOM</span></h1>
    <div class="sub">ALLEN HOME &nbsp;·&nbsp; 15 VERMONT AVE &nbsp;·&nbsp; CONGERS NY</div>
  </div>
  <div class="hdr-right">
    <div id="clock">--:--:--</div>
    <div id="dateline">—</div>
    <div id="modebadge">DAY WATCH</div>
  </div>
</header>

<section id="hero">
  <div id="herobig">CONNECTING</div>
  <div id="herosub">READING HOME ASSISTANT STATE…</div>
</section>

<main>
  <!-- NEEDS ATTENTION -->
  <section class="panel">
    <h2>NEEDS ATTENTION</h2>
    <div id="attnlist"><div id="attnclear">Checking…</div></div>
  </section>

  <!-- THE BASICS -->
  <section class="panel">
    <h2>THE BASICS</h2>
    <div class="brow"><span class="bk">FRONT DOOR</span><span class="bv" id="b-front">—</span></div>
    <div class="brow"><span class="bk">BACK DOOR</span><span class="bv" id="b-back">—</span></div>
    <div class="brow"><span class="bk">GARAGE</span><span class="bv" id="b-garage">—</span></div>
    <div class="brow"><span class="bk">WASHER</span><span class="bv" id="b-washer">—</span></div>
    <div class="brow"><span class="bk">DRYER</span><span class="bv" id="b-dryer">—</span></div>
    <div class="brow"><span class="bk">CAMERAS</span><span class="bv" id="b-cams">—</span></div>
    <div class="brow"><span class="bk">NOW PLAYING</span><span class="bv" id="b-play">—</span></div>
  </section>

  <!-- DEVICES -->
  <div id="devstrip">
    <div id="devline1">—</div>
    <div id="devline2"></div>
  </div>
</main>

<footer id="footline">UPDATED — · FEED: HOME ASSISTANT VIA DECO MESH</footer>

<script>
  // ===== WAR ROOM (CALM) — live state from house-status.json =====
  // Published from Home Assistant every 5 minutes by the house-status poller.
  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    var m = d.getMinutes(); if (m < 10) m = '0' + m;
    return h12 + ':' + m + ' ' + ap;
  }

  function refreshStatus() {
    fetch('house-status.json?ts=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(s){
        var doors = s.doors || {};
        var laundry = s.laundry || {};
        var net = s.network || {};
        var pres = s.presence || {};
        var devs = s.devices || [];
        var decos = s.decos || [];

        // ----- basics -----
        function doorRow(id, state) {
          var el = document.getElementById(id);
          if (state === 'open') el.innerHTML = '<span class="bad">OPEN</span>';
          else if (state === 'closed') el.innerHTML = '<span class="ok">CLOSED</span>';
          else el.textContent = '—';
        }
        doorRow('b-front', doors['Front door']);
        doorRow('b-back', doors['Back door']);
        doorRow('b-garage', doors['Garage']);

        function runRow(id, appliance) {
          var el = document.getElementById(id);
          if (appliance && appliance.running) el.innerHTML = '<span class="ok">RUNNING</span>';
          else if (appliance) el.innerHTML = '<span class="dim">IDLE</span>';
          else el.textContent = '—';
        }
        runRow('b-washer', laundry.washer);
        runRow('b-dryer', laundry.dryer);

        var camKinds = { camera: 1, doorbell: 1 };
        var cams = devs.filter(function(d){ return camKinds[d.kind]; });
        var camsOn = cams.filter(function(d){ return d.online; }).length;
        var camEl = document.getElementById('b-cams');
        if (cams.length) {
          camEl.innerHTML = camsOn + ' / ' + cams.length + ' ONLINE' +
            (camsOn < cams.length ? ' <span class="warn">▼</span>' : '');
        } else camEl.textContent = '—';

        var mp = s.media_playing || [];
        document.getElementById('b-play').textContent = mp.length ? mp[0].toUpperCase() : '—';

        // ----- problems (hero + needs attention) -----
        var problems = [];  // {text, level: 'alert'|'soft'}
        ['Front door', 'Back door', 'Garage'].forEach(function(n){
          if (doors[n] === 'open') problems.push({ text: n.toUpperCase() + ' OPEN', level: 'alert' });
        });
        if (net.internet_online === false) problems.push({ text: 'INTERNET OFFLINE', level: 'alert' });
        var expected = { 'Home Assistant Hub': 1, 'Kitchen Wall Display': 1 };
        devs.forEach(function(d){
          if (d.online) return;
          if (camKinds[d.kind]) problems.push({ text: d.name.toUpperCase() + ' OFFLINE', level: 'alert' });
          else if (expected[d.name]) problems.push({ text: d.name.toUpperCase() + ' OFFLINE', level: 'alert' });
        });
        decos.forEach(function(d){
          if (d.online === false) problems.push({ text: d.name.toUpperCase() + ' OFFLINE', level: 'alert' });
        });

        var big = document.getElementById('herobig');
        var sub = document.getElementById('herosub');
        var attn = document.getElementById('attnlist');
        if (problems.length) {
          big.className = 'alert';
          big.textContent = problems[0].text;
          attn.innerHTML = problems.map(function(p){
            return '<div class="attn' + (p.level === 'soft' ? ' soft' : '') + '">' + p.text + '</div>';
          }).join('');
        } else {
          big.className = '';
          big.textContent = 'PERIMETER SECURE';
          attn.innerHTML = '<div id="attnclear">ALL CLEAR — nothing needs you.</div>';
        }

        var home = [];
        if (pres.mike) home.push('MIKE');
        if (pres.heather) home.push('HEATHER');
        var homeTxt = home.length ? home.join(' + ') + ' HOME' : 'NOBODY HOME';
        var devTxt = (net.clients_online != null) ? net.clients_online + ' DEVICES ONLINE' : '';
        sub.textContent = homeTxt + (devTxt ? ' · ' + devTxt : '') + ' · UPDATED ' + fmtTime(s.generated_at);

        // ----- devices strip -----
        var inUse = devs.filter(function(d){ return d.online && d.in_use; })
                        .map(function(d){ return d.name; });
        document.getElementById('devline1').innerHTML =
          '<b>' + (net.clients_online != null ? net.clients_online : '—') + ' ONLINE</b>' +
          ' · IN USE NOW: ' + (inUse.length ? inUse.join(', ') : 'none');
        var offlineOther = devs.filter(function(d){
          return !d.online && !camKinds[d.kind] && !expected[d.name];
        }).map(function(d){ return d.name; });
        document.getElementById('devline2').textContent =
          offlineOther.length ? 'OFFLINE: ' + offlineOther.join(', ') : '';

        document.getElementById('footline').textContent =
          'UPDATED ' + fmtTime(s.generated_at) + ' · FEED: HOME ASSISTANT VIA DECO MESH';
      })
      .catch(function(){
        var big = document.getElementById('herobig');
        big.className = 'warn';
        big.textContent = 'FEED OFFLINE';
        document.getElementById('herosub').textContent = 'STATUS FEED UNREACHABLE — RETRYING EVERY MINUTE';
      });
  }
  refreshStatus();
  setInterval(refreshStatus, 60000);

  // ===== CLOCK / MODE =====
  function tick() {
    var now = new Date();
    var h = now.getHours();
    var night = (h >= 21 || h < 7);
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    var ap = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    document.getElementById('clock').textContent = h12 + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds()) + ' ' + ap;
    var days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
    var mons = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    document.getElementById('dateline').textContent = days[now.getDay()] + ' · ' + mons[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
    document.body.classList.toggle('night', night);
    document.getElementById('modebadge').textContent = night ? 'NIGHT WATCH' : 'DAY WATCH';
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
